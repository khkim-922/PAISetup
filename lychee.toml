# lychee 설정 — **이 저장소가 무엇을 안 재나.** 명령은 여기 없다.
#
# 명령(`--offline` 등)의 진본은 게이트 조각 `.githooks/gates.d/links.sh` 한 벌이고, 그것은
# 익명이라 저장소 이름도 폴더 이름도 모른다. 여기는 그 반대편 — 이 저장소에만 있는 자리다.
#
# ⚠ **`exclude_path` 는 글롭이 아니라 정규식이다** (lychee 0.24 실측 — `**` 는 문법 오류).
# ⚠ **경로 구분자를 안 적는다** — 윈도우 lychee 는 경로를 역슬래시로 내서 `a/b` 꼴이 안 문다.
# ⚠ **홑따옴표로 적는다.** TOML 의 겹따옴표는 `\` 를 이스케이프로 먹어 `"\.claude"` 가
#   설정 파싱 오류로 죽는다(실측 · lychee 3 으로 지고 조각이 「못 쟀다」를 낸다).
#   홑따옴표는 리터럴이라 정규식을 적은 그대로 넘긴다.
#
# ⚠ 아래는 전부 **화물**이다 — 뽑기가 진본에서 실어 온 것이라 여기서 고치면 다음 뽑기에
#   사라진다. 링크가 성한가는 진본 저장소의 같은 조각이 이미 잰다.

exclude_path = [
  # 규범·룰·스킬
  '\.claude',
  # 설정 저장소 씨앗 · 게이트웨이 · 검사 묶음
  'seeds',
  # 남이 쓴 코드. 허락받아 싣는다
  'posco',
  # `docs/dist-readme.md` 에서 온다
  'README\.md',
  # 설치 창이 여는 안내 한 장. 진본은 `docs/config-repo-howto.html`
  'config-repo-howto\.html',
]
