# tools.global.conf — 전역 도구 선언 (진본: claude-config/.claude/tools.global.conf)
#
# **전역 스킬이 부르는 도구만** 든다 — 어느 저장소에서 열어도 그 스킬이 돌아야 하는 것들.
# 저장소 자기 도구는 각 저장소의 .claude/tools.conf 가 든다. 도구가 늘면 여기 블록을
# 더한다 — 훅(몸통)은 안 고친다. 새 설치법·프로브 갈래가 필요할 때만 몸통을 고친다.
#
# 필드
#   install      = github-release-binary | npm-global | apt-package | winget | pip-user | project-axis
#                  pip-user 는 **PC 의 파이썬**(PATH 의 것 · 저장소 venv 가 아니다)에 `--user` 로 깐다
#   tag          = github-release-binary 갈래에서 받을 릴리스 태그(그대로 · 예 `v0.11.0`). 박으면
#                  최신이 아니라 그 릴리스에 머문다. **안 박는 것이 기본이다** — 게이트 도구는
#                  최신을 따른다(결정 0067). 자산 이름의 `{tag}` 는 박은 태그로, 안 박았으면
#                  최신 태그로 채운다 — 자산 이름에 판이 물린 도구도 그래서 최신을 받는다
#   winget-id    = winget 갈래의 패키지 id (`winget search` 가 내는 그 값). **폴더째 와야
#                  도는 도구**가 이 갈래다 — 실행파일 하나만 꺼내면 깔린 것처럼 보이고
#                  안 도는 물건들. 윈도우에서만 서고, 다른 자리에서는 사유를 남기고 비켜선다
#   probe        = exec-on-path | exec-npm-bin | node-resolvable | python-importable | machine-python-importable | python-version
#                  python-importable 은 저장소 venv 가 서 있으면 그쪽을 재고, machine-python-importable 은
#                  venv 를 안 보고 PC 의 파이썬만 잰다 — pip-user 의 짝이다
#   probe-target = 프로브가 실제로 부르는 이름 (실행파일·모듈).
#                  python-version 갈래에서는 맞출 판("3.14" 꼴 · 부판까지만) — 「깔렸나」가
#                  아니라 「선언한 판과 같나」를 재고, venv 도 그 판으로 세운다.
#                  PATH 에 없으면 uv 로 내려받는다 — 패치판은 uv 목록의 최신이 정한다
#   probe-arg    = 실행 갈래의 인자 (생략하면 --version). 인자를 받고도 안 멈추는 도구용
#   package      = npm 패키지 — pip-user 갈래에서는 PyPI 배포 이름이고 판은 안 박는다.
#                  이름만 적으면 최신을 받는다(기본 · 결정 0067). **`이름@판` 꼴로
#                  판을 박으면 프로브가 판까지 잰다** — 「깔렸나」와 「선언한 판인가」는 다른
#                  명제라, 안 재면 판을 박아도 옛 판이 깔린 기계에서 그냥 통과한다
#   wiring       = none | node-link
#   wiring-env   = node-link 이 이름 해석에 실패했을 때 값을 넘길 환경변수 이름.
#                  값은 **그 모듈의 폴더**다 — 진입점을 훅이 추측하지 않는다.
#                  받는 쪽이 폴더를 푼다(제 package.json 이 진입점의 진본이다)
#   browsers     = 패키지와 따로 오는 브라우저 (npm-global 갈래)
#   skip-browsers-env = 이 환경변수가 서 있으면 브라우저를 안 받는다 (컨테이너가 미리 받아 둔 자리)
#   browsers-fallback = 그 받기가 막혔을 때 대신 부를 저장소 안 스크립트 —
#                  경로는 선언을 든 저장소 기준. **몸통은 무엇을 받는지 모른다**
#   called-by    = 무엇이 이 도구를 부르나 — 진단 표시용. 소유 층 판정의 근거이기도 하다
#   on-demand    = yes 면 훅이 안 깐다 — 전역 걸음이 이름만 찍고 건너뛰고, 진단은 안 닿아도
#                  빨강이 아니라 「필요할 때 깐다」로 낸다. 부르는 자(called-by)가 제 손으로
#                  찾고 없으면 까는 법을 댄다. 한 기계에서만 쓰는 도구(굽는 자 · 사내 망에서
#                  받기 힘든 것)가 이 갈래다 — 안 달면 붙은 기계 전부가 받으러 간다
#
# ⚠ **새 판은 세션 훅이 받는다** — `UPGRADE_DAYS` 마다 깔린 판과 최신 판을 견주고 **다를 때만**
#   다시 깐다(`.claude/hooks/session-start-body.sh` 의 `tool_version_have` · `tool_version_latest`).
#   오른 줄은 설치 출력에 「새 판으로 올렸다: 옛 → 새」로 남는다.
#   ⚠ 윈도에서 `github-release-binary` 도구가 winget 자리(`%LOCALAPPDATA%\Microsoft\WinGet` 의 `Links` · `Packages`)에서
#   PATH 에 닿으면 훅은 설치기의 winget 이 든 것으로 보고 깔지도 올리지도 않으며, `~/bin` 에 남은 제 사본은
#   `<bin>.paisetup-retired` 로 이름을 바꿔 비킨다 — 판은 winget 이 올린다(`grb_foreign`). 다른 사본(배포판 · venv)과
#   리눅스는 이 가름이 없다 — 훅이 제 자리에 깔아 그것들을 가린다.
# ⚠ npx --yes 는 설치법도 프로브도 아니다 — 리모트 컨테이너에서 두 번 실패한 실측이 있고,
#   "깔렸나"와 "닿나"를 섞어 제3의 상태를 만든다 (claude-config 0004).

[lychee]
install = github-release-binary
repo = lycheeverse/lychee
asset-linux = lychee-x86_64-unknown-linux-gnu.tar.gz
asset-windows = lychee-x86_64-pc-windows-msvc.zip
bin = lychee
probe = exec-on-path
probe-target = lychee
wiring = none
called-by = doc-coordinate-audit 스킬 · 커밋 게이트(.githooks/gates.d/links.sh)
# ⚠ 판이 올라 설정 문법이 갈리면 설정 쪽을 고친다 — 실제로 물린 자리가 하나 있다:
#   `exclude_path` 는 0.24 에서 글롭이 아니라 정규식이다(실측).

# 파이썬 결함 판정 — 커밋 게이트 조각이 담긴 .py 만 잰다. 규칙은 `.claude/ruff.global.toml` 이 든다.
# ⚠ npm 의 `ruff` 는 **딴 패키지**(1.x · 무관)라 npm-global 갈래를 못 쓴다(실측 2026-09-12).
#   릴리스 자산 이름이 lychee 와 같은 꼴이라 그 갈래로 받는다.
[ruff]
install = github-release-binary
repo = astral-sh/ruff
asset-linux = ruff-x86_64-unknown-linux-gnu.tar.gz
asset-windows = ruff-x86_64-pc-windows-msvc.zip
bin = ruff
probe = exec-on-path
probe-target = ruff
wiring = none
called-by = 커밋 게이트(.githooks/gates.d/python.sh)

# 셸 결함 판정 — 푸시 문 조각이 미는 판에서 바뀐 .sh 만 잰다.
# ⚠ 자산 이름에 판이 물렸다(`shellcheck-v0.11.0.linux.x86_64.tar.xz`) — `{tag}` 를 훅이 최신 태그로
#   채운다(위 `tag` 칸). 배포판 apt 의 것은 판이 뒤처져 안 쓴다.
[shellcheck]
install = github-release-binary
repo = koalaman/shellcheck
asset-linux = shellcheck-{tag}.linux.x86_64.tar.xz
asset-windows = shellcheck-{tag}.zip
bin = shellcheck
probe = exec-on-path
probe-target = shellcheck
wiring = none
called-by = 푸시 문(.githooks/gates.d/shellcheck.sh)

[markdownlint-cli2]
install = npm-global
package = markdownlint-cli2
probe = exec-on-path
probe-target = markdownlint-cli2
# --version 만 주면 안 멈추고 저장소 전체를 린트한다(실측 2026-08-16) — 글롭을 꺼야 끝난다
probe-arg = --no-globs --version
wiring = none
called-by = doc-coordinate-audit 스킬 · atelier · AI-prompt-helper 의 CI(.github/workflows/ci.yml)

# 커밋 메시지 형식. 규칙 파일은 저장소가 제 것(`commitlint.config.*`)을 두면 그것이, 없으면 전역
# `.claude/commitlint.global.mjs` 가 들고, 낱말 목록은
# 명세가 든다(규범 [Conventional Commits]) — 어느 쪽도 여기 옮겨 적지 않는다.
[commitlint]
install = npm-global
package = @commitlint/cli
probe = exec-on-path
probe-target = commitlint
wiring = none
called-by = atelier · AI-prompt-helper 의 CI(.github/workflows/ci.yml · PR 판 · 규칙은 .claude/commitlint.global.mjs)

# ⚠ **짝으로 든다 — 규칙 파일이 이 이름을 부른다.** `extends: ['@commitlint/config-conventional']`
#   이 풀려야 규칙이 선다. `node-link` 는 그 이름을 저장소 안에서도 풀리게 잇는다.
#   ⚠ **`node-link` 는 보험이지 지금 무게를 지는 자리가 아니다.** 실측 2026-09-11
#     (리눅스 · npm 전역 · commitlint 21.2.2): **링크를 걷어도 규칙이 그대로 살았다** —
#     전역 설치 곁에 이 패키지가 함께 서면 commitlint 가 제 설치 자리에서 이름을 마저 푼다.
#     그 폴백은 npm 이 전역을 어디 두느냐에 달려 있고 **윈도우 배치에서는 안 쟀다** —
#     그래서 링크를 걷지 않는다.
[commitlint-config-conventional]
install = npm-global
package = @commitlint/config-conventional
probe = node-resolvable
probe-target = @commitlint/config-conventional
wiring = node-link
called-by = .claude/commitlint.global.mjs 의 extends(저장소가 제 규칙 파일을 두면 그 파일의 것)

# 보고 덱 생성 — 공식 pptx 스킬이 덱을 짓는 엔진이다(ppt-report 스킬 3절 · 결정 0169). 그 스킬은 「미리 깔려 있다」고
#   전제하는데 그것은 Anthropic 샌드박스 이야기라 우리 PC 에는 없다 — require 가 실패하면 모델이 양식을 풀어 XML 을
#   손으로 쓰는 길로 물러나 글상자와 표만 남는다. `node-link` 가 그 이름을 저장소 안에서도 풀리게 잇는다.
[pptxgenjs]
install = npm-global
package = pptxgenjs
probe = node-resolvable
probe-target = pptxgenjs
wiring = node-link
called-by = ppt-report 스킬이 짓는 덱 스크립트 · 공식 pptx 스킬(anthropic-skills:pptx · document-skills:pptx)

# 그림 줄이기 — 그림 문이 큰 그림을 「줄여서 연다」로 돌려보내면 그 줄이기가 PIL 로 돈다. 문과 부품이
#   전역이라(홈 훅 · 검사 씨앗) 의존성도 전역이다. 없으면 줄이기가 원본 치수로 물러난다.
# ⚠ **배포본 설치기도 이 절을 읽는다** — 뽑는 자(`scripts/build-dist.sh`)가 `pip-user` 절의 `package`
#   를 모아 값 파일의 `#pip-packages` 로 싣는다. 이름을 두 곳에 적지 않는다.
[pillow]
install = pip-user
package = pillow
probe = machine-python-importable
probe-target = PIL
wiring = none
called-by = 그림 문 훅(.claude/hooks/image-gate.py)의 줄이기(seeds/check/_check/_shrink.py) · drm-office-read 스킬

# PPT 덱 검수 — 공식 pptx 스킬(`anthropic-skills:pptx` · `document-skills:pptx`)이 pip 로 부르는 패키지다(그 스킬이 적은 의존: `markitdown[pptx]` ·
#   Pillow · `defusedxml` · `lxml`). 없으면 모델이 도구를 안 깔고 제 손 검수로 샛길을 간다. 그림 검수는 파워포인트로
#   하므로(ppt-report 스킬 6절) `soffice` · Poppler 는 안 깐다 — 여기는 파이썬 패키지뿐이고 Pillow 는 위 절이 든다.
# ⚠ **`markitdown[pptx]` 를 한 줄로 안 적고 `markitdown` 과 `python-pptx` 로 가른다.** `package` 값에 대괄호가 들면
#   세션 훅의 판 읽기(`importlib.metadata`)가 그 이름을 못 찾아 빈 값을 내고, 훅은 판을 못 읽으면 밀 때마다 다시
#   깐다. 프로브도 절마다 하나라 `markitdown` 만 재고 `pptx` 가 들어왔는지는 안 본다 — 엑스트라의 내용물이 곧
#   `python-pptx` 절이다.
# ⚠ **`defusedxml` · `lxml` 은 `markitdown` · `python-pptx` 가 끌고 오지만 따로 적는다** — 스킬의 스크립트가 직접
#   가져오는 것이라, 끌려오는 관계가 그 패키지의 판에서 바뀌어도 프로브가 먼저 말하게 한다.
# ⚠ **프로브는 import 만 잰다.** `markitdown` 명령이 새 터미널에서 잡히나는 파이썬의 `Scripts\` 폴더가 사용자 PATH 에
#   서 있나에 달려 있고, 여기서는 안 잰다.
[markitdown]
install = pip-user
package = markitdown
probe = machine-python-importable
probe-target = markitdown
wiring = none
called-by = 공식 pptx 스킬(`markitdown` 명령 — 슬라이드 내용 덤프 · 빈 칸 찾기) · ppt-report 스킬

[python-pptx]
install = pip-user
package = python-pptx
probe = machine-python-importable
probe-target = pptx
wiring = none
called-by = markitdown 의 pptx 읽기(`markitdown[pptx]` 엑스트라의 내용물) · 공식 pptx 스킬이 안내하는 python-pptx 편집(그 스킬의 스크립트는 직접 안 가져온다) · ppt-report 스킬

[defusedxml]
install = pip-user
package = defusedxml
probe = machine-python-importable
probe-target = defusedxml
wiring = none
called-by = 공식 pptx 스킬의 scripts(clean · thumbnail · office/validate 가 XML 을 읽을 때) · ppt-report 스킬

[lxml]
install = pip-user
package = lxml
probe = machine-python-importable
probe-target = lxml
wiring = none
called-by = 공식 pptx 스킬의 scripts/office/validators(OOXML 검증) · python-pptx 의 XML 처리 · ppt-report 스킬

# JSON 처리 — skill-stocktake 스킬의 스크립트 셋이 파이프마다 부른다. 없으면 그 스크립트가 첫 줄에서
#   죽는다(`set -e` · 127).
# ⚠ **winget 갈래다 — 릴리스 자산이 묶음이 아니라 실행파일 하나라서다.** `github-release-binary` 는
#   .zip · .tar.gz · .tar.xz 만 푼다. 리눅스에서는 이 갈래가 사유를 남기고 비켜선다 — 배포판이 이미
#   들고 있으면 프로브가 먼저 통과한다.
[jq]
install = winget
winget-id = jqlang.jq
probe = exec-on-path
probe-target = jq
wiring = none
called-by = skill-stocktake 스킬(scripts/scan.sh · quick-diff.sh · save-results.sh)

# 파이썬 프로젝트 실행기 — skill-comply 스킬이 `uv run` 으로 돈다(제 pyproject.toml 의 의존성은 uv 가
#   그 자리에서 푼다 — PyYAML 을 따로 안 깐다). 세션 훅도 선언한 파이썬 판이 PATH 에 없으면 uv 로 받는다.
[uv]
install = github-release-binary
repo = astral-sh/uv
asset-linux = uv-x86_64-unknown-linux-gnu.tar.gz
asset-windows = uv-x86_64-pc-windows-msvc.zip
bin = uv
probe = exec-on-path
probe-target = uv
wiring = none
called-by = skill-comply 스킬(uv run python -m scripts.run) · 세션 훅의 파이썬 판 맞추기

# 파이썬 판 — **판을 올리는 자리는 아래 `probe-target` 한 줄뿐이다.** 개발·운영 세계(회사 PC 의 파이썬)와 같은
#   판으로 돈다 — 다른 판으로 재면 같은 코드가 두 세계에서 다르게 판정되므로 바닥이 아니라 일치로 문다(결정 0008).
#   부판까지만 적는다 — 패치판은 받는 자리(uv 목록 · winget)의 최신이 정한다. 따르는 자는 넷이다 —
#   · 세션 훅 ③ 파이썬 축 — 저장소 venv 를 이 판으로 세운다. 저장소가 제 `tools.conf` 에 같은 갈래
#     (`probe = python-version`)를 두면 그쪽이 이긴다 — 이 파일 → 저장소 선언 차례로 읽어 뒤가 이긴다
#   · 세션 훅 전역 걸음(리눅스) — 세션이 부르는 `python3` 자리(`~/.local/bin`)가 비었거나 uv 의 링크인데 이 판이
#     아니면 uv 로 세운다. 저장소 venv 감싸개가 선 자리는 안 건드린다. 판을 올리면 전역 지문이 바뀌어 다음
#     세션이 이 걸음을 다시 돈다
#   · 설치기 — 뽑는 자(`scripts/build-dist.sh`)가 값 파일의 `#python-version` 으로 싣고, 설치기가 그 값으로
#     winget id(`Python.Python.<판>`)를 짓는다 — winget 에는 판 없는 CPython id 가 없다
#   · 저장소 CI — 제 `tools.conf` 에 `[python]` 이 없으면 저장소에 둔 이 파일의 사본을 읽어 setup-python 에 넘긴다
# ⚠ 진단은 venv 가 안 서는 저장소(`requirements.txt` 없음)에서 이 절을 안 그린다 — 잴 venv 가 없다.
# ⚠ `requirements.txt` 를 두고 제 `[python]` 을 안 둔 저장소는 venv 가 이 판에 묶인다 — 다른 판으로 돌아야 하는
#   저장소는 제 `tools.conf` 에 `[python]` 을 둔다.
[python]
install = project-axis
probe = python-version
probe-target = 3.14
called-by = 세션 훅(저장소 venv · 리눅스 세션의 python3) · 설치기(winget 의 Python 줄) · atelier · AI-prompt-helper 의 venv 와 CI(setup-python)
