# ruff.global.toml — **파이썬 결함 판정.** 어느 저장소에서도 같은 자로 잰다.
#
# 진본은 claude-config/.claude/ruff.global.toml 다. 각 저장소의 것은 deploy.ps1 이 뿌린
# 배포본이다 — 배포본을 고치면 다음 배포에 덮인다.
#
# 부르는 자는 커밋 게이트 조각(.githooks/gates.d/python.sh)이다. 저장소가 뿌리에 제 설정
# (`ruff.toml` · `.ruff.toml` · `[tool.ruff]` 든 `pyproject.toml`)을 두면 **그쪽이 이기고** 이
# 파일은 안 읽힌다 — 마크다운 판정과 같은 규율이다(claude-config 결정 0039).
#
# ⚠ **결함 부류만 켠다 — 실측이 근거다.** 2026-09-12 · ruff 0.16.7 · 세 저장소(파이썬 160개 ·
#   8만 줄): 도구 기본 묶음으로 972건이 났는데 결함 부류는 57건이고 **그중 진짜 결함은 0**
#   (정의 안 된 이름 0 · 루프 변수 붙든 함수 5는 다 그 자리에서 곧 불리는 오탐). 줄 길이(E501)
#   만 4,594건 — 그것을 켜면 게이트가 코드가 아니라 글을 고치게 한다. 이 파일의 값은 쌓인 것을
#   치우는 자가 아니라 **앞으로 새는 것을 막는 자**다.
#
#   F     pyflakes — 정의 안 된 이름 · 안 쓰는 import·변수 · 자리 표시자 없는 f-string
#   E9    문법 오류 · 못 읽는 파일
#   B023  루프 변수를 붙든 함수 — 나중에 불리면 마지막 값만 본다
#   B904  except 안의 raise 에 `from` 이 없다 — 원인이 사라진다

[lint]
select = ["F", "E9", "B023", "B904"]
