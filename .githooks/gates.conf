# gates.conf — **이 저장소가 어느 검사를 켜나.** 저장소가 커밋한다(배포본이 아니다).
#
# 몸통(`pre-commit` · `commit-msg`)은 설정 저장소가 뿌린 문지기이고 조각(`gates.d/*.sh`)은 거기서 찾아 부르므로
# 어느 저장소에서든 같다. 갈리는 것은 이 파일 하나다 — 켜고 끄는 자리를 훅 본문이 아니라
# 선언에 둔 까닭이 그것이다.
#
# 이름은 `gates.d/<이름>.sh` 다. **선언에 있는데 조각을 못 찾으면 막지 않고 「못 쟀다」로 이름을 대며 말한다**(claude-config
# 결정 0064) — 대개 이 PC 의 설정 저장소가 뒤처진 탓이다. 선언의 오타도 같은 줄로 뜬다.
#
# ⚠ **이 저장소는 짐의 대부분이 화물이다** — 담긴 `.md` 가 지금은 전부 뽑기가 진본에서
#   실어 온 것이라, 여기서 고치면 다음 뽑기에 사라진다. 그래서 링크 검사는 켜 두되
#   **화물을 제외 목록이 가른다**(`lychee.toml`). 지금 재는
#   것이 거의 없는 것은 그 뜻이고, 화물이 아닌 글이 생기는 날 저절로 걸린다.

[pre-commit]
# 링크·앵커. 제외는 `lychee.toml`
links
# 결정 목록이 결정 기록의 머리말과 어긋났나. 지금은 `docs/decisions/` 가 없어 스스로
# 물러난다 — 이 저장소가 제 결정을 들게 되는 날 저절로 걸린다.
adr-index
# ⚠ **이 저장소가 집인 진본이 여기 산다** — `install.ps1` · `install.ui.ps1` · `install.cmd`.
#   파워셸은 BOM 이 있어야 하고 cmd 는 없어야 한다. **남의 PC 에서만** 깨지는 자리다.
encoding
# 설치기의 「칸 없이 까는 걸음」이 도구 홈의 스킬 폴더에서 사람의 스킬 · 같은 이름의 사람 폴더 · 다른 주인의 자리를 지키나 —
#   `install.ps1` 이 담겼을 때만 돈다. 조각과 검사는 설정 저장소에 살아, 그 저장소가 없는 PC 에서는 「못 쟀다」로 지나간다.
free-skills
# 설치기가 사람의 레지스트리 값에 우리 것을 더할 때 사람의 것을 지키나 — 사용자 PATH 에 덧댈 때 남의 자리 · 값의 꼴 · 길이
#   한도를 지키고, 워드 옵션 키에 쓸 때 같은 키의 다른 워드 설정을 두나(#29 · #143) — 조각과 검사는 설정 저장소에 산다.
npm-path
# 설치기가 Claude 훅을 손에 맡기는 걸음에서 사람의 홈 설정 · Codex · agy 설정의 사람 훅을 두고, 동의 없이 앱을 안 끄며,
#   심기가 지은 루트에 든 것을 안 걷고, 끝 검증이 거짓 [O] 를 안 내나(#133 훅) — 조각과 검사는 설정 저장소에 산다.
dist-hooks
# 설치기가 회사 키 · 게이트웨이 주소의 임자를 값으로 가려 사외에서는 우리 것만 걷고 사람 값은 두며, 키의 암호화 사본으로
#   사내 회차가 키를 다시 세우나(#44 · #45) — `install.ps1` 이 담겼을 때 돈다. 조각과 검사는 설정 저장소에 산다.
dist-keys
# 설치기가 사외 회차에서 Codex · 안티그래비티의 회사 연결을 틀 값 그대로일 때만 걷고 사람이 고친 것은 두며 끝 검증이 사외
#   줄을 재나(#44 ⑩) — `install.ps1` 이 담겼을 때 돈다. 조각과 검사는 설정 저장소에 산다.
offsite-config
# 설치기가 회차를 넘기는 기록에 사람이 고른 것만 두고 짐의 사실은 그 판 짐에서 읽으며, 창 · 콘솔 · 자동 실행이 같은 자리를
#   같은 꼴로 읽나(#45) — `install.ps1` · `install.ui.ps1` 이 담겼을 때 돈다. 조각과 검사는 설정 저장소에 산다.
dist-records
# 설치기가 자리를 바꿔 깔 때 다른 자리에만 선 Codex 모델 값을 걷으면서 사람이 고른 값은 두나 — `install.ps1` 이 담겼을 때
#   돈다. 조각과 검사는 설정 저장소에 산다.
model-table
# 설치기가 agy · Copilot · Codex 에 그 도구 제 승인 설정(묻지 않고 돌기)을 심을 때 사람 값을 안 덮고, 남의 키와 못 읽는 파일은
#   두나(결정 0127) — `install.ps1` 이 담겼을 때 돈다. 조각과 검사는 설정 저장소에 산다.
tool-autorun
# ⚠ 설치기 흐름을 가짜 홈에서 끝까지 돌리는 무거운 둘(hook-handoff · stall-guard)은 이 문에 안 선다 — 한 판이 분 단위라
#   설치기 커밋마다 몇 분을 막았다(claude-config #170 2 판). 둘 다 쓰는 사람의 계약이라 늦어도 동료에게 가기 전에 서야 하고,
#   그 자리가 건넴 전 문이다 — 배포본 뽑기(claude-config `scripts/build-dist.sh`)가 그 검사 몸통을 이 설치기로 부르고
#   빨갛거나 못 재면 안 뽑는다.
