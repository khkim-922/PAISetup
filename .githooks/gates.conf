# gates.conf — **이 저장소가 어느 검사를 켜나.** 저장소가 커밋한다(배포본이 아니다).
#
# 몸통(`pre-commit` · `commit-msg`)과 조각(`gates.d/*.sh`)은 설정 저장소에서 뿌린 배포본이라
# 어느 저장소에서든 같다. 갈리는 것은 이 파일 하나다 — 켜고 끄는 자리를 훅 본문이 아니라
# 선언에 둔 까닭이 그것이다.
#
# 이름은 `gates.d/<이름>.sh` 다. **선언에 있는데 조각이 없으면 어긋남으로 문다.**
#
# ⚠ **이 저장소는 짐의 대부분이 화물이다** — 담긴 `.md` 가 지금은 전부 뽑기가 진본에서
#   실어 온 것이라, 여기서 고치면 다음 뽑기에 사라진다. 그래서 문서 검사 둘은 켜 두되
#   **화물을 제외 목록이 가른다**(`.markdownlint-cli2.jsonc` · `lychee.toml`). 지금 재는
#   것이 거의 없는 것은 그 뜻이고, 화물이 아닌 글이 생기는 날 저절로 걸린다.

[pre-commit]
# 담긴 .md 만 잰다. 제외는 `.markdownlint-cli2.jsonc`
markdown
# 링크·앵커. 제외는 `lychee.toml`
links
# 결정 목록이 결정 기록의 머리말과 어긋났나. 지금은 `docs/decisions/` 가 없어 스스로
# 물러난다 — 이 저장소가 제 결정을 들게 되는 날 저절로 걸린다.
adr-index
# ⚠ **이 저장소가 집인 진본이 여기 산다** — `install.ps1` · `install.ui.ps1` · `install.cmd`.
#   파워셸은 BOM 이 있어야 하고 cmd 는 없어야 한다. **남의 PC 에서만** 깨지는 자리다.
encoding

[commit-msg]
commit-format
