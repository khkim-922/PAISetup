# 게이트웨이 검사가 앱의 배관을 무는 **좌표 선언** — 이 저장소의 값은 여기 산다.
#
# 검사 파일들은 사본이라 진본과 글자가 같아야 `borrowed_check.py` 가 초록이다. 그래서
# 저장소마다 갈리는 것(배관 모듈 이름 · 자리를 옮긴 속성 몇)을 검사 안에 안 박고 이 한 장이
# 든다. 읽는 자는 `_plumb.py` 이고, 뜻은 그 머리말이 든다.
#
# 무는 자는 여기 손으로 안 든다 — 한 줄로 나온다(앵커를 뺀 꼴은 산문까지 세어 하나 많다):
#
#   grep -l "^from _plumb import" _check/*.py
#
# 선언이 없으면 아래 씨앗 기본값으로 돈다.

[plumb]
# 배관이 사는 모듈. 검사가 무는 이름 **대부분**이 여기서 그대로 나온다 — 아래 칸들이 드는
# 것은 갈린 예외뿐이다(형제 실측 넷).
module = app.gateway
# 갈래별 말하기(스트림·봉투·CLI 파이프)가 사는 모듈.
# ⚠ **이 칸에 사는 이름은 `[where]` 를 안 적어도 닿는다** — 위 `module` 에 없으면 `_plumb` 이
#   이 모듈을 이어서 본다(배관 → 말하기 차례). 봉투 예산처럼 말하기 쪽에 사는 이름을 저장소
#   마다 한 줄씩 적던 손사본이 그래서 없어졌다.
providers = app.providers

[where]
# **위 두 모듈이 안 드는 자리만** 적는다 — 좌표는 `모듈:이름`.
# 이름이 같고 모듈만 옮겼으면 모듈만 갈고, 이름까지 갈렸으면 뒤엣것도 간다.
# 이 저장소는 넷 다 위 두 모듈이 들어 비어 있다 — 갈린 형제가 제 판에서 채운다.
#
#   LOGS_DIR   = app.config:LOGS_DIR     ← 기록 자리를 설정 모듈이 드는 저장소
#   env_token  = app.config:_env_token   ← 이름 앞에 밑줄이 붙은 저장소
#   ENV_PREFIX = app.config:ENV_PREFIX   ← 접두어를 배관이 안 들면 아래 [values] 로 간다
#   SYSTEM_MARKS_BUDGET = app.providers:CACHE_MARK_CAP
#                                        ← 봉투 예산을 다른 이름으로 드는 저장소

[values]
# **이 저장소에 속성이 아예 없는 자리** — 값을 여기 둔다. 좌표가 아니라 값이다.
# 까닭 없이 적으면 다음 사람이 못 되짚으므로 줄마다 까닭을 단다.
# 이 저장소는 배관이 셋을 다 들어 비어 있다.
#
#   ENV_PREFIX = ATELIER   ← 접두어 규율이 배관이 아니라 `_check/env_names.conf` 에 사는 저장소

[no_handle]
# **이 앱이 아예 안 여는 환경변수 손잡이** — 칸 이름은 접두어를 뗀 이름이고(`PROVIDER` →
# `{접두어}_PROVIDER`), **값은 좌표도 값도 아니라 그렇게 둔 까닭**이다. 그 까닭이 검사의
# 「뺀 자리」 줄에 그대로 찍히므로, 다음 사람이 진본을 안 열어도 왜 뺐는지 안다.
#
# ⚠ 위 `[values]` 와 층이 다르다 — 저쪽은 「배관에 그 **속성**이 없다」이고 이쪽은 「그
#   속성을 밖에서 바꾸는 **환경변수**가 없다」다. 기본 갈래를 상수로 두는 앱은
#   `DEFAULT_PROVIDER` 속성을 멀쩡히 들고 있어, `[values]` 에 적으면 거짓말이 된다.
# ⚠ **까닭을 빈 줄로 두지 않는다** — 뺄 근거가 곧 그 까닭이라, 비면 검사가 「못 쟀다」(2)로
#   말하고 나간다. 빈 채로 받으면 판정이 근거 없이 사라지고, 안 받으면 적은 사람은 왜 그대로
#   빨강인지 모른다 — 둘 다 조용하므로 그 자리에서 말한다.
# ⚠ **이 절이 여는 것은 「잴 것이 없다」이지 「안 재도 된다」가 아니다.** 손잡이를 여는 앱이
#   이 줄을 적으면 그 앱의 난간이 안 재진 채 초록이 된다 — 검사는 선언을 실측으로 되뽑지
#   않으므로(되뽑는 자가 곧 뺀 판정 자체다) 참인지는 적는 사람이 든다.
#
# 이 저장소는 손잡이를 다 열어 비어 있다 — 배관이 다 `_env(…)` 로 연다(`app/gateway.py`).
# 비면 **손잡이가 다 있다**가 기본이라 검사가 그 자리를 그대로 잰다.
# 누가 이 절을 읽나는 손으로 안 든다 — 한 줄로 나온다: `grep -l NO_HANDLE _check/*.py`
#
#   PROVIDER = 기본 갈래를 상수로 둔다(`DEFAULT_PROVIDER`) — 고칠 손잡이는 담장 하나라고 앱이 적어 뒀다
#              ← 담장 검사의 ④ 둘과 ⑤ 뒤엣것 · 봉투 검사 [6] 셋을 「뺀 자리」로 내린다
#   WALL_MAX_TOKENS = 게이트웨이 벽에서 역산한 상수다 — 벽이 옮겨지면 따라 옮길 값이라 밖에서 못 바꾸게 뒀다
#              ← 봉투 검사 [5] 의 그 한도 하나만 내린다. 나머지 한도 셋은 그대로 잰다
