# 이 파일이 **당신 것**이다 — 세션 훅(`.claude/hooks/session-start.sh`)의 개인 칸은 이름을
# 모르고 여기에 묻는다.
#
# 형식은 `이름=값` 한 줄씩. `#` 은 주석이고 값에 따옴표를 두르지 않는다.
# ⚠ **몸통을 고치지 말고 여기를 고친다.** 저장소가 늘 때도 여기다 —
#   목록을 코드에 넣으면 다음 사람이 코드를 읽고 고쳐야 하고, 그 판은 조용히 갈린다.
# ⚠ **이 저장소 안의 자리는 여기 안 든다** — 훅이 전역 저장소 자리로 파생한다.
#   `deploy.ps1` · `vdi-home-settings.json` · (만든다면) `secrets.env` · `secrets.d/` 가 다
#   그렇게 찾아진다. 그래서 저장소 이름을 무엇으로 짓든, 나중에 바꾸든 안 깨진다.

# ── git 신원 — 커밋에 박히는 이름이다 ─────────────────────────────────────────
# ⚠ 이메일은 GitHub 의 **noreply** 꼴을 권한다. 사내 저장소가 아니면 제 메일이 공개 커밋에
#   그대로 박힌다. 자기 값은 GitHub → Settings → Emails 에 적혀 있다.
GIT_NAME=your-github-id
GIT_EMAIL=00000000+your-github-id@users.noreply.github.com

# ── 저장소 — 이 PC 에 받아 둘 것들 ────────────────────────────────────────────
# 빈칸으로 가른다. 없으면 clone 칸이 통째로 건너뛰어진다.
REPOS=

# 어디서 받나. `<이름>` 자리에 위 `REPOS` 의 이름이 하나씩 들어간다.
# ⚠ **주소를 저장소마다 적지 않는다** — 꼴 하나로 파생시킨다. 손으로 든 목록은 저장소가
#   늘 때 한 줄을 빼먹고, 빼먹은 줄은 그 저장소를 처음 쓰는 날에만 드러난다.
REPO_URL=https://github.com/your-github-id/<이름>.git

# 받아 둘 자리. `install.ps1` 이 이 저장소를 `~/repos` 로 clone 하므로 기본이 그것이다.
# ⚠ **바꾸면 고칠 자리가 둘이다** — 여기와 `install.ps1` 의 `$root`. 한쪽만 고치면
#   설치는 지정한 데로 받고 훅은 딴 데를 뒤져, 있는 저장소를 「없다」로 판정한다.
ROOT=$HOME/repos

# ── 개인화할 도구 — 배포가 Claude 말고도 규범 · 룰 · 스킬을 밀 도구 홈. 빈칸으로 가른다 ──────────
# `codex` · `agy` 를 적는다. Claude 홈은 이 값과 상관없이 늘 받는다 — 그것이 이 저장소의 본업이다.
# 빈 값이면 Claude 만 받는다 — Codex · agy 는 규범 없이 가볍게 쓴다. 이 줄을 지우면 이 PC 에 있는 도구 다다.
# ⚠ **도구가 없는 PC 에는 안 간다** — 배포는 그 도구의 홈(`~/.codex` · `~/.gemini`)이 있을 때만 민다.
# ⚠ **배포본 설치기의 제작자 칸과 상관없다** — 이 저장소를 붙인 PC 에서는 그 칸이 비켜서고 개인화는 여기가 정한다.
DEPLOY_HOMES=codex agy
