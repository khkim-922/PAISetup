# tool-homes.conf — 갈 곳 표. 무엇이 어느 도구 홈에 어떤 꼴로 가나 (결정 0112).
#
# 읽는 자는 손 하나(`.claude/hooks/tool-homes.py`)와, 짐에 싣는 줄을 이 표에서 짓는 뽑는 자(`scripts/build-dist.sh`)다.
# 설치기 · 배포 · 세션 훅은 이 표를 안 읽고 손을 부른다 — 그래서 이 표가 든 사실을 그 셋 안에 다시 적지 않는다.
#
# 손은 PC 의 중립 한 벌 `~/.paisetup` 의 두 층을 채우고, 이 표대로 도구 홈에 놓는다. 어느 도구도 그 자리를 스스로 안 읽는다.
#   standard/ — 설치기가 짐(kit)에서 채운다
#   personal/ — 배포와 세션 훅이 설정 저장소에서 채운다
#   항목마다, 개인 층에 있으면 개인 층이 통째로 이긴다
# 이 표는 설정 저장소의 conf 다 — 씨앗 설정 저장소에도 실려, 씨앗으로 만든 저장소도 제 자리에 둔 제 원본으로 개인 층을 채운다.
#
# ⚠ 주석은 `#` 로 여는 줄 전체뿐이다. 칸은 빈칸으로 가르고, 칸 값에는 빈칸이 들 수 없다.

# ── item <항목> <층 안의 자리> <저장소 자리> [local] ──────────────────────────────────────────────────────
# 층 안의 자리는 짐의 꼴이다 — 짐에서는 `kit/<층 안의 자리>` 에 있다. 저장소 자리는 설정 저장소 뿌리 기준이고, 개인 층은 이
# 칸으로만 채운다. 저장소에 그 자리가 없으면 그 항목은 개인 층에서 조용히 빠지고 표준 층이 이긴다. 끝이 `/` 면 폴더고, 두 자리의
# 꼴(파일 · 폴더)은 같다.
# local — 짐에 안 싣는 항목이라 개인 층에만 선다. 뽑는 자는 local 아닌 항목마다 `<저장소 자리> -> kit/<층 안의 자리>` 줄을
#   지어 싣는다 — 그 줄은 `dist.manifest.conf` 에 다시 안 적는다.
item   norms    norms/norms.md   .claude/CLAUDE.global.md
item   rules    norms/rules/     .claude/rules.global/
item   agents   agents/          agents/                     local

# ── route <항목> <도구> <꼴> <자리> <조건> ─────────────────────────────────────────────────────────────────
# 꼴
#   import  — 그 파일의 표지 사이에 가져오기 한 줄(`@~/.paisetup/<이긴 층>/<층 안의 자리>`)을 둔다. 표지 밖 글은 사람 것이다
#   block   — 그 파일의 표지 사이에 원본 본문을 지어 얹는다. 가져오기 문법이 없는 도구의 꼴이다
#   lines   — 같은 파일의 block 에 룰마다 「이 파일들을 만질 때 이 룰을 먼저 읽는다」 한 줄을 더한다(룰 머리말의 globs · description)
#   include — 파일 통째로 우리 것이다. agy 의 가리킴 한 줄 `@[<항목>](<이 PC 홈의 절대 경로>/…)`
#   list    — 파일 통째로 우리 것이다. agy 의 목록 `{"entries": [{"path": <이 PC 홈의 절대 경로>/…}]}`
#   copy    — 항목의 파일을 그 폴더에 복사한다
#   copy · include · list 로 놓은 파일은 `~/.paisetup/placed.tsv` 에 적는다. import · block 은 표지가 우리 것을 말한다
# 조건
#   box     — 제작자 칸(`PAISETUP_PERSONAL`)에 그 도구가 들었나. 값이 없으면 claude 만이다
route  norms    claude   import    ~/.claude/CLAUDE.md             box
route  rules    claude   copy      ~/.claude/rules/                box
route  agents   claude   copy      ~/.claude/agents/               box
route  norms    codex    block     ~/.codex/AGENTS.md              box
route  rules    codex    lines     ~/.codex/AGENTS.md              box
route  norms    agy      include   ~/.gemini/config/AGENTS.md      box
route  rules    agy      list      ~/.gemini/config/rules.json     box

# ── old <자리> ──────────────────────────────────────────────────────────────────────────────────────────────
# 손이 걷는 옛 자리 — 새 층이 선 뒤 백업 자리로 옮긴다.
old    ~/.paisetup/norms/

# ── stamp <UTC ISO 8601> ──────────────────────────────────────────────────────────────────────────────────
# 판 도장 — 짐과 씨앗에 실리는 이 표의 사본에만 선다. 뽑는 자가 원본 커밋 시각을 `2026-10-12T03:04:05Z` 꼴(UTC · 초까지 ·
# 사전순이 곧 시간순)로 사본 끝에 한 줄 찍고, 이 원본에는 없다. 놓기는 손이 선 두 층 가운데 표의 도장이 새 층의 손이 한다 —
# 도장 없는 표는 가장 새 판(작업장)이고, 같으면 개인 층이다.
stamp 2026-10-11T19:12:06Z
