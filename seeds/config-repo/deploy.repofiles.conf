# deploy.repofiles.conf — 저장소마다 한 벌씩 두는 파일 목록.
#
# 이 목록을 두 자가 읽는다: deploy.ps1(뿌리는 자)과 scripts/check-global-copies.sh(재는 자).
# 손사본 둘로 두면 한쪽만 고쳐지고, 그러면 **재는 자가 새 자산을 안 재면서 초록을 낸다**
# — 실제로 그렇게 났다 (docs/decisions/0021).
#
# 경로는 저장소 뿌리 기준이고 구분자는 `/` 다 — 파워셸 쪽에서 `\` 로 바꿔 쓴다.
# 자산을 더할 때 고칠 자리는 **여기 한 줄뿐이다.**
#
# ⚠ **`.claude/` 밑에 자산을 더할 때는 이름을 `*.global.*` 꼴로 짓는다.** 받는 저장소들의
#   `.gitignore` 가 `.claude/*` 를 막고 그 규약으로 예외를 받기 때문이다 — 다른 이름으로
#   지으면 그 저장소에서 **조용히 무시되어 커밋에 안 담기고, 새로 클론한 자리에서만 빈다.**
#   규약을 어겨야 할 자산이면 그 저장소들의 무시 규칙도 같이 고친다.
#   지키는 자는 `scripts/check-global-copies.sh` 다 — 자산이 추적되고 있나를 저장소마다 묻는다.

.claude/hooks/session-start.sh
.claude/hooks/utf8-bom.sh
.claude/settings.json
.claude/tools.global.conf
# 브라우저를 받아 오는 뒷길. `[playwright]` 선언의 `browsers-fallback` 이 **저장소 기준 경로로**
# 가리키므로, 그 선언을 든 저장소마다 같은 자리에 한 벌씩 서야 한다.
# ⚠ 진본이 여기로 온 까닭 — 이 저장소가 **여러 저장소에 한 벌씩 나눠 주고 어긋남을 재는**
#   자리다. 형제에 두고 베끼면 손사본 둘이 되는데, 여기 얹으면 파생물이고 재는 자가 문다.
.claude/get-browser.sh

# ── 커밋 게이트 ──────────────────────────────────────────────────────────────
# 몸통 둘과 러너는 **익명이다** — 저장소 이름도 검사 이름도 모르고, 무엇을 재나는 각
# 저장소가 커밋하는 `.githooks/gates.conf` 가 든다. 그래서 여기 한 벌로 뿌려도 저장소마다
# 다른 검사가 돈다.
# ⚠ **`gates.conf` 는 여기 없다 — 저장소 것이다.** 뿌리면 저장소가 고른 판이 다음 배포에
#   덮인다. 켜고 끄는 자리가 저장소에 남아야 이 구조가 뜻이 있다.
# ⚠ `core.hooksPath` 를 맞추는 것은 파일이 아니라 설정이라 이 목록 밖이다 — `deploy.ps1`
#   과 세션 훅이 `.githooks/` 를 든 저장소에 건다.
.githooks/pre-commit
.githooks/commit-msg
.githooks/gates-run.sh
.githooks/claude-config-path.sh
# 조각 — 여러 저장소가 켜는 것만 뿌린다.
# ⚠ `gates.d/dist.sh` 는 **여기 없다.** 배포본을 뽑는 저장소가 지금 이 저장소뿐이라 다른
#   데서는 켤 일이 없다(안 켜도 파일은 서므로 무해하지만, 안 쓰는 것을 뿌리면 남에게 가는
#   씨앗에도 실린다). 다른 저장소가 배포본을 뽑게 되는 날 이 줄을 더한다.
.githooks/gates.d/encoding.sh
.githooks/gates.d/markdown.sh
.githooks/gates.d/links.sh
.githooks/gates.d/adr-index.sh
.githooks/gates.d/commit-format.sh
.githooks/gates.d/python.sh

# 문체 판정 — 우리 글이 어느 저장소에서든 똑같이 낳는 마크다운 오탐. 저장소 설정
# (`.markdownlint-cli2.jsonc`)이 `extends` 로 이 파일을 가리키고, **그 파일 기준 상대경로**로
# 풀리므로 저장소마다 같은 자리에 한 벌씩 서야 한다.
# ⚠ 진본이 여기인 까닭 — 형제 저장소 둘이 **같은 규칙을 같은 값으로 각자 적어 두고
#   있었다**(실측 2026-09-11: `MD060`/`table-column-style` 이 이름만 달랐다). 손으로 두 번
#   내린 판정은 세 번째에서 갈린다.
.claude/markdownlint.global.jsonc
# 커밋 메시지 규칙 — 같은 축이다. 우리 제목 문체가 낳는 오탐 하나를 든다.
# 저장소가 뿌리에 `commitlint.config.mjs` 를 두면 조각이 그쪽을 먼저 보므로, 이것은
# **안 둔 저장소를 위한 바닥**이다 — 덮어쓰지 않는다.
.claude/commitlint.global.mjs
.claude/ruff.global.toml
