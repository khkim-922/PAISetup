# 견본 — **이 파일 하나가 PC 하나다.** 이름을 제 PC 로 바꾸고(`work.conf` · `home.conf` 처럼)
# 값을 제 것으로 고친다. 옆 `README.md` 가 형식을 든다.
#
# ⚠ **고친 뒤 이 견본을 지운다.** 안 지워도 `deploy.ps1` 은 없는 경로를 조용히 건너뛰어
#   고장은 안 나지만, 남는 순간부터 「어느 쪽이 내 것인가」를 사람이 매번 다시 읽어야 한다.
# ⚠ **`deploy.ps1` 을 고치지 않는다.** PC 가 늘면 이 폴더에 파일을 더할 뿐이다 — 그것이
#   이 선언이 있는 까닭이고, 포크한 사람이 upstream 을 머지해도 여기서 안 무는 까닭이다.

# 저장소마다 한 벌씩 두는 배포본(훅 몸통과 그 등록)을 받을 저장소 루트.
# **무엇이 가나는 `deploy.repofiles.conf` 가 든다** — 여기 옮겨 적지 않는다.
[repos]
C:\Users\<사용자>\repos\<저장소>

# `memory/<이름>/` 이 갈 `~/.claude/projects/` 슬러그.
# 슬러그는 Claude Code 가 **프로젝트의 전체 경로**에서 만든 폴더 이름이라 PC마다 다르다 —
# 영숫자가 아닌 글자가 전부 `-` 다. 확인은 `ls ~/.claude/projects`.
# ⚠ **한글이 든 경로는 글자 수로 세지 바이트로 세지 않는다** — 한 자가 대시 셋이 되면
#   폴더는 멀쩡히 만들어지는데 메모리가 조용히 안 깔린다.
[memory:<저장소>]
C--Users-<사용자>-repos-<저장소>

# 전역 층 — 저장소 하나가 아니라 저장소들을 담은 폴더에서 연 세션이 쓴다.
[memory:global]
C--Users-<사용자>-repos
