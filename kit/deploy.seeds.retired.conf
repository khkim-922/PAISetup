# deploy.seeds.retired.conf — 홈(~/.claude/)에서 **걷는** 씨앗 폴더 목록. 한 줄 한 폴더 · 저장소 뿌리 기준 · 구분자 `/`.
#
# deploy.seeds.conf 의 짝이다 — 저쪽은 홈으로 미는 폴더, 여기는 한때 밀다가 표에서 뺀 폴더다. 표에서 줄만 빼면 홈에 놓인 사본은
# 아무도 안 걷어, 낡은 손이 그 자리에서 조용히 계속 불린다(결정 0225 「홈의 옛 씨앗 걷기」). 폴더를 표에서 뺄 때 고칠 자리는
# 저쪽 한 줄을 지우고 여기 한 줄을 더하는 것뿐이다. 줄마다 왜 걷나 · 그 손이 이제 어디 사나를 곁에 적는다.
#
# 이 목록을 셋이 읽는다 — 셋 다 이 한 장이고, 사본을 손으로 들지 않는다.
#   deploy.ps1(PC) · .claude/hooks/session-start-body.sh(세션마다) — 이 저장소 뿌리에 deploy.seeds.conf 가 있을 때만(홈 씨앗의 원본인
#     저장소). 홈의 그 폴더에서 **이 저장소 이력이 그 자리에 두었다 지운 파일**과 그 파일의 `__pycache__` 만 걷는다 — 기본 실행이
#     원본이 걷은 씨앗 파일을 걷는 것과 같은 자다(deploy.ps1 `Get-SeedColumn`). 이력에 없는 파일(사람이 둔 것)은 안 건드리고 폴더도
#     그래서 남는다 — 배포는 그것을 제거 후보로 알리고 `-Prune` 이 걷으며, 세션 훅은 경고 한 줄을 낸다. 걷는 파일은 백업 자리로
#     옮긴다(배포 `~/.claude/backups/deploy-<시각>/` · 세션 훅 `~/.claude/backups/session-seeds-<시각>/`).
#   설치기(PAISetup install.ps1 「공용 자산」 걸음) — 배포본 짐의 `kit/deploy.seeds.retired.conf` 로 읽는다(dist.manifest.conf 가
#     이 파일을 그대로 싣는다). 거울로 깔던 자리라 폴더째 백업 자리(`~/.claude/backups/install-seeds-<시각>/`)로 옮긴다. 설정
#     저장소가 홈 씨앗의 원본인 PC 에서는 비켜선다 — 그쪽은 위 둘이 걷는다.
#
# ⚠ 폴더 이름이 다시 deploy.seeds.conf 로 돌아가면 여기서 지운다 — 남겨도 원본에 있는 파일은 안 걷히지만(위 자), 설치기는 그 폴더를
#   통째로 옮긴다.

seeds/session   # 사내 앱 세션 손 — 스킬 ep-login 의 scripts/ 로 갔다(0225)
seeds/mail      # 사내 메일 보내기 · 받기 손 — 스킬 company-mail 의 scripts/ 로 갔다(0225)
seeds/calendar  # 사내 일정 손 — 스킬 company-calendar 의 scripts/ 로 갔다(0225)
seeds/ecm       # 사내 문서함(ECM) 손 — 스킬 company-ecm 의 scripts/ 로 갔다(0225)
