<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 바깥을 부르는 길과 스크립트를 페이지가 스스로 닫는다 — 글은 메일에서 온 것을 품는다. 링크를 눌러 웹메일로 가는 것은 막지 않는다.
     스크립트는 곁의 report.js 하나만 그 해시로 연다 — 메일에서 온 글이 스크립트 · on… 속성으로 서도 돌지 않는다 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src $script_hash; base-uri 'none'; form-action 'none'">
<title>$page_title</title>
<!--
  보고 창의 틀 — 사용자가 고른 디자인(ember-studio · 세리프)에서 뼈대와 CSS 만 떴다. 내용은 하나도 들지 않는다.
  채우는 손은 곁 폴더의 scripts/window.py 이고, $$ 로 시작하는 자리 다섯(page_title · side_title · toc · hero · sections)에 그날 보고를,
  script · script_hash 에 곁의 report.js 와 그 해시를 넣는다.
  글꼴은 이 PC 에 깔린 것만 쓴다 — 바깥 글꼴을 부르지 않는다.
-->
<style>
  :root {
    --primary: #C2410C;
    --primary-hover: #9A3412;
    --neutral: #78716C;
    --bg: #FAFAF9;
    --surface: #F5F5F4;
    --raised: #E7E5E4;
    --text: #1C1917;
    --text-2: #57534E;
    --border: #D6D3D1;
    --warning: #D97706;
    --error: #DC2626;
    --serif: 'Playfair Display', 'Noto Serif KR', 'Nanum Myeongjo', Batang, '바탕', Georgia, serif;
    --sans: 'Source Sans 3', 'Noto Sans KR', 'Malgun Gothic', '맑은 고딕', sans-serif;
    --mono: 'Fira Code', Consolas, 'Malgun Gothic', monospace;
    --section-gap: 48px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 400;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  a { color: var(--primary); }
  a:hover { color: var(--primary-hover); }
  a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
  strong { font-weight: 600; }
  code {
    font-family: var(--mono);
    font-size: 14px;
    background: var(--raised);
    border-radius: 4px;
    padding: 0 4px;
  }

  /* ── 골격 ── */
  .layout {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 256px minmax(0, 1fr);
    gap: 48px;
  }

  /* ── 왼쪽 절 목록 ── */
  .side {
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    overflow-y: auto;
    padding: 48px 24px 48px 0;
    border-right: 1px solid var(--border);
    background: var(--bg);
  }
  .side-head { margin-bottom: 24px; }
  .side-head .who { font-size: 12px; color: var(--neutral); letter-spacing: 0.08em; margin: 0; }
  .side-head .what { font-family: var(--serif); font-weight: 600; font-size: 20px; letter-spacing: -0.02em; line-height: 1.3; margin: 4px 0 0; }
  .side-head .what a { color: inherit; text-decoration: none; }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc li + li { margin-top: 4px; }
  .toc a {
    display: block;
    padding: 8px 12px;
    color: var(--text-2);
    text-decoration: none;
    font-size: 14px;
    border-left: 3px solid transparent;
    border-radius: 0 8px 8px 0;
    transition: background-color 150ms ease, color 150ms ease;
  }
  .toc a.sub { padding-left: 28px; }
  .toc a:hover { background: var(--raised); color: var(--text); border-left-color: var(--primary); }

  /* ── 본문 ── */
  main { padding: 48px 0 80px; min-width: 0; }
  section, .hero-block, .sub-head { scroll-margin-top: 24px; }
  main > section { margin-top: var(--section-gap); }

  .eyebrow { font-size: 11px; letter-spacing: 0.08em; color: var(--neutral); margin: 0; font-weight: 600; }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 48px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin: 8px 0 12px;
  }
  .lede { font-size: 20px; line-height: 1.5; color: var(--text-2); margin: 0; }
  .dateline { font-size: 14px; color: var(--neutral); margin: 12px 0 0; }

  /* 마감 시간줄 — 점 하나가 마감 하나 */
  .clock-wrap { margin-top: 32px; border-top: 1px solid var(--border); padding-top: 24px; }
  .clock-label { font-size: 14px; font-weight: 600; color: var(--text-2); margin: 0 0 16px; }
  .clock-scroll { overflow-x: auto; }
  .clock {
    --n: 3;
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(var(--n), minmax(168px, 1fr));
    min-width: calc(var(--n) * 168px + (var(--n) - 1) * 24px);
    gap: 24px;
    position: relative;
  }
  .clock::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 5px;
    border-top: 1px solid var(--border);
  }
  .clock li { position: relative; padding-top: 24px; }
  .clock li::before {
    content: "";
    position: absolute;
    left: 0; top: 0;
    width: 12px; height: 12px;
    border-radius: 9999px;
    background: var(--text);
  }
  .clock .t {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    display: block;
  }
  .clock .d { display: block; margin-top: 4px; }
  .clock .n { display: block; font-size: 14px; color: var(--text-2); margin-top: 4px; }
  .clock-also { margin: 16px 0 0; font-size: 14px; color: var(--text-2); }

  .summary {
    margin-top: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .summary p { margin: 0; max-width: 68ch; }
  .summary p + p { margin-top: 12px; }

  h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.02em;
    margin: 0 0 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .intro { margin: -8px 0 16px; color: var(--text-2); }
  .para { margin: 16px 0 0; max-width: 68ch; }

  /* 카드 — 낱낱이 딸린 줄 */
  .tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
  .rows + .tasks, .caution + .tasks, .para + .tasks, .sub-head + .tasks { margin-top: 16px; }
  .task {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: grid;
    grid-template-columns: 40px minmax(0, 1fr);
    gap: 16px;
  }
  .task.plain { grid-template-columns: minmax(0, 1fr); }
  .task-num { font-family: var(--serif); font-weight: 600; font-size: 28px; line-height: 1; color: var(--neutral); }
  .task h3 { font-size: 20px; font-weight: 600; line-height: 1.4; margin: 0; }
  .when { margin: 4px 0 0; font-size: 14px; color: var(--text-2); }
  .points { margin: 16px 0 0; padding-left: 20px; }
  .points li + li { margin-top: 8px; }
  .facts {
    margin: 16px 0 0;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 80px minmax(0, 1fr);
    gap: 8px 16px;
    font-size: 14px;
  }
  .facts dt { font-weight: 600; color: var(--text-2); }
  .facts dd { margin: 0; }

  /* 누름 단추 — 끝났음 · 내일 다시 · 안 올려도 됨. 스크립트가 표시를 거둘 수 있는 창에서만 꺼낸다 */
  .task-top, .row-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .task-top h3 { min-width: 0; }
  .row-top > div { min-width: 0; }
  .marks { flex: none; display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; max-width: 55%; }
  .marks[hidden] { display: none; }
  .mark {
    font: inherit;
    font-size: 13px;
    line-height: 1.5;
    padding: 3px 11px;
    border: 1px solid var(--border);
    border-radius: 9999px;
    background: var(--bg);
    color: var(--text-2);
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .mark:hover { border-color: var(--primary); color: var(--text); }
  .mark:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .mark[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: var(--bg); font-weight: 600; }
  .mark-note { flex-basis: 100%; text-align: right; font-size: 12px; color: var(--neutral); }
  .mark-note:empty { display: none; }
  .is-done h3, .is-done > .row-top > div:first-child, .is-done > div > .row-top > div:first-child { color: var(--neutral); text-decoration: line-through; text-decoration-thickness: 1px; }
  .is-done .points, .is-done .facts, .is-done .when { opacity: 0.6; }
  .is-later h3, .is-later > .row-top > div:first-child, .is-later > div > .row-top > div:first-child { color: var(--neutral); }
  .is-later .points, .is-later .facts, .is-later .when { opacity: 0.6; }
  .is-quiet h3, .is-quiet .points, .is-quiet .facts, .is-quiet .when, .is-quiet > .row-top > div:first-child,
  .is-quiet > div > .row-top > div:first-child { opacity: 0.5; }
  .tick-off { margin: 12px 0 0; font-size: 14px; color: var(--text-2); }
  .tick-off[hidden] { display: none; }

  /* 사람별 — 같은 줄을 사람으로 한 번 더 */
  .people { margin-top: 32px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; scroll-margin-top: 24px; }
  .pcol { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; }
  .pcol h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .pcol .sub { margin: 2px 0 12px; font-size: 13px; color: var(--neutral); }
  .pcol ul { list-style: none; margin: 0; padding: 0; }
  .pcol li { display: grid; grid-template-columns: minmax(6em, max-content) 1.6em minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .pcol .who { font-weight: 600; }
  .pcol .cnt { color: var(--primary); font-weight: 600; }
  .pcol .none { margin: 0; font-size: 14px; color: var(--neutral); }

  /* 보고 맞추기 — 보고 시각 · 올리지 않기로 한 것 */
  .prefs { margin-top: var(--section-gap); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .prefs h2 { font-size: 22px; border: 0; padding: 0; margin: 0 0 4px; }
  .prefs .hint { margin: 0 0 8px; font-size: 14px; color: var(--text-2); }
  .prefs h3 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--border); border-radius: 9999px;
          background: var(--bg); font-family: var(--serif); font-weight: 600; font-size: 18px; }
  .chip.is-new { border-color: var(--primary); border-style: dashed; }
  .chip-new { font-family: var(--sans); font-weight: 400; font-size: 11px; color: var(--primary-hover); }
  .pcol .item.is-done a { color: var(--neutral); text-decoration: line-through; }
  .pcol .item.is-done .pill { opacity: 0.5; }
  .pref-list li.is-fresh > span:first-child { color: var(--primary-hover); }
  .pref-none[hidden], .hint[hidden], #later-head[hidden] { display: none; }
  .chip-x, .undo { font: inherit; font-family: var(--sans); font-weight: 400; font-size: 12px; border: 1px solid var(--border); background: var(--bg);
                   border-radius: 9999px; padding: 1px 8px; cursor: pointer; color: var(--text-2); }
  .chip-x:hover, .undo:hover { border-color: var(--primary); color: var(--text); }
  .chip-x[hidden], .undo[hidden], .add-time[hidden], .btn[hidden] { display: none; }
  .add-time { display: inline-flex; gap: 6px; align-items: center; }
  .add-time input { font: inherit; padding: 3px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  .btn { font: inherit; font-size: 14px; padding: 5px 14px; border-radius: 9999px; border: 1px solid var(--primary); background: var(--primary);
         color: var(--bg); cursor: pointer; font-weight: 600; }
  .btn.ghost { background: var(--bg); color: var(--primary); }
  .btn:focus-visible, .chip-x:focus-visible, .undo:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .pref-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
  .pref-list li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; padding: 10px 0;
                  border-bottom: 1px solid var(--border); font-size: 14px; }
  .pref-list li.is-undone > span:first-child { color: var(--neutral); text-decoration: line-through; }
  .undo-note { flex-basis: 100%; text-align: right; font-size: 12px; color: var(--neutral); }
  .undo-note:empty { display: none; }
  .pref-none { margin: 0; font-size: 14px; color: var(--neutral); }
  .note { font-size: 13px; color: var(--neutral); margin: 8px 0 0; }
  .note:empty { display: none; }

  /* 작은 절 */
  .sub-head { margin: 40px 0 0; }
  .sub-head h3 { font-size: 20px; font-weight: 600; line-height: 1.4; margin: 0; }
  .sub-head p { margin: 4px 0 0; font-size: 14px; color: var(--text-2); }

  /* 줄 */
  .rows { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid var(--border); }
  h2 + .rows, .intro + .rows { margin-top: 0; }
  h2 + .rows { border-top: 0; }
  h2 + .rows > li:first-child { padding-top: 0; }
  .rows > li { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .rows.numbered > li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; }
  .rows .num { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.4; color: var(--neutral); }
  .src-inline { font-size: 14px; color: var(--neutral); }

  /* 기한 표지 — 붉은 것은 기한 지남 */
  .pill {
    display: inline-block;
    border-radius: 9999px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.8;
    white-space: nowrap;
    vertical-align: 0.1em;
    background: var(--raised);
    color: var(--text-2);
  }
  .pill.over { background: var(--error); color: var(--bg); }

  /* 메일 번호 — 메일함 주소가 없어 링크를 못 지은 자리 */
  .unid { font-family: var(--mono); font-size: 12px; color: var(--neutral); word-break: break-all; }

  /* 주의 상자 */
  .caution {
    margin: 16px 0 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--warning);
    border-radius: 12px;
    padding: 16px 24px;
  }
  h2 + .caution, .intro + .caution { margin-top: 0; }
  .caution p { margin: 0; }
  .caution p + p, .caution ul + p { margin-top: 8px; }
  .caution ul { margin: 8px 0 0; padding-left: 20px; }
  .caution li + li { margin-top: 8px; }

  /* 일정에 없는 약속 — 카드 하나가 넣을 일정 하나. 「일정에 넣기」는 스크립트가 누름을 거둘 수 있는 창에서만 꺼낸다 */
  .appt { border-left: 4px solid var(--primary); }
  .put-row { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center;
             justify-content: space-between; gap: 8px 16px; }
  .put-what { font-size: 15px; font-weight: 600; }
  .put-what .vis { font-weight: 400; font-size: 13px; color: var(--text-2); }
  .put { font: inherit; font-size: 14px; font-weight: 600; padding: 6px 16px; border-radius: 9999px; border: 1px solid var(--primary);
         background: var(--bg); color: var(--primary); cursor: pointer; white-space: nowrap; }
  .put:hover { background: var(--primary); color: var(--bg); }
  .put:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .put[aria-pressed="true"] { background: var(--primary); color: var(--bg); }
  .put[disabled] { cursor: default; opacity: 0.85; }
  .put[disabled]:not([aria-pressed="true"]) { border-color: var(--border); color: var(--text-2); background: transparent; }
  .put[hidden] { display: none; }
  .put-note { flex-basis: 100%; font-size: 13px; color: var(--text-2); margin: 0; }
  .put-note:empty { display: none; }
  .put-note.ok { color: #15803D; }
  .put-note.no { color: var(--error); }
  .no-time { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--border); font-size: 14px; color: var(--text-2); }

  footer { margin-top: var(--section-gap); padding-top: 24px; border-top: 1px solid var(--border); font-size: 14px; }
  .to-top { font-weight: 600; text-decoration: none; padding: 8px 0; display: inline-block; }
  .to-top:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .toc a, .mark { transition: none; }
  }

  @media (max-width: 1024px) { :root { --section-gap: 32px; } }

  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .side {
      height: auto;
      overflow-y: visible;
      border-right: none;
      border-bottom: 1px solid var(--border);
      z-index: 10;
      margin: 0 -24px;
      padding: 0 24px;
    }
    .side-head { display: none; }
    .toc ul { display: flex; overflow-x: auto; gap: 4px; }
    .toc li + li { margin-top: 0; }
    .toc a, .toc a.sub {
      white-space: nowrap;
      padding: 12px;
      border-left: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
    }
    .toc a:hover { border-bottom-color: var(--primary); background: transparent; }
    section, .sub-head, .hero-block { scroll-margin-top: 64px; }
    main { padding-top: 32px; }
  }
  @media (max-width: 600px) {
    :root { --section-gap: 24px; }
    h1 { font-size: 28px; }
    .lede { font-size: 16px; }
    .task { padding: 16px; gap: 12px; }
    .task-top, .row-top { flex-direction: column; gap: 8px; }
    .marks { max-width: 100%; justify-content: flex-start; gap: 8px; }
    .mark { min-height: 40px; padding: 6px 14px; font-size: 14px; }
    .chip-x, .undo { min-height: 32px; padding: 4px 10px; }
    .mark-note { text-align: left; }
    .people { grid-template-columns: minmax(0, 1fr); }
    .put { min-height: 40px; }
  }
</style>
</head>
<body>
<div class="layout">

  <aside class="side" aria-label="이 보고의 차례">
    <div class="side-head">
      <p class="who">메일 비서</p>
      <p class="what"><a href="#top">$side_title</a></p>
    </div>
    <nav class="toc">
      <ul>
$toc
      </ul>
    </nav>
  </aside>

  <main>
    <header class="hero-block" id="top">
      <p class="eyebrow">메일 비서</p>
$hero
    </header>
$sections
    <footer>
      <a class="to-top" href="#top">맨 위로</a>
    </footer>
  </main>
</div>
<script>$script</script>
</body>
</html>
