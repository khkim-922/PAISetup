# models.conf — 맡기기 모델 표. 자리마다 어느 무게의 일을 어느 도구의 어느 모델에 맡기나.
#
# 읽는 자는 둘이다 — 맡기는 세션(SKILL.md 1 절)과 배포본 설치기. 설치기는 이 표에서 러너의 자리 값을 심고, 러너는 그 값만
# 읽는다. 모델 이름은 이 표에만 산다 — 스킬 · 러너 · 설치기는 이 표를 가리킨다.
#
# 주석은 `#` 로 여는 줄 전체뿐이다. 칸은 빈칸으로 가르고, 끝 칸(모델)만 줄 끝까지라 빈칸이 들 수 있다.
# ⚠ 꼴에 안 맞는 줄이 하나라도 있으면 설치기는 이 표에서 아무 값도 안 심고 빨간 줄로 끝난다.
#
# ── <자리> <도구> <무게> <모델> ─────────────────────────────────────────────────────────────────────────
# 자리 — 설치기가 잰 자리: inside 사내 · outside 사외(자리를 모르면 사외). 설치기가 사용자 환경변수 PAISETUP_SITE 로 남긴다
# 도구 — claude(서브에이전트 · Codex 와 agy 에서는 claude-background) · codex(codex-copilot-background) · agy(agy-background)
# 무게 — SKILL.md 1 절의 둘: deep 깊은 판단 · errand 심부름. 그 자리에서 그 무게를 못 지는 도구는 줄이 없다
#        fallback — 무게가 아니라 넘길 차례다. 앞 모델이 한도 · 과부하면 줄의 차례로 넘어간다(agy 만)
# 모델 — 그 도구가 받는 이름 그대로. `-` 는 도구가 제 설정의 기본 모델로 뜬다(설치기가 아무 값도 안 심는다)
#
# 도구마다 이 표가 가는 자리
#   claude — 서브에이전트의 `model` 인자(claude-background 는 `--model`)로 준다. 별칭이 가리킬 실제 모델은 자리가 정한다 —
#            게이트웨이 자리는 `opus` 를 사용자 환경변수 ANTHROPIC_DEFAULT_OPUS_MODEL 이, 다른 별칭은 게이트웨이 앞 로컬
#            프록시의 별칭 표가 푼다
#   agy    — deep → AGY_MODEL_DELEGATE ·
#            errand → AGY_DEFAULT_MODEL · fallback → AGY_FALLBACK_MODELS (`;` 로 잇는다 — 그래서 이름에 `;` 가 못 든다).
#            이름은 `agy models` 의 표시 이름이고, `api:` 를 붙인 이름은 API 키(GOOGLE_API_KEY · GEMINI_API_KEY)가 있을 때만 산다
#   codex  — deep → CC_BG_CODEX_MODEL_DELEGATE · errand → CC_BG_CODEX_MODEL. 맡기기에만
#            쓰는 값이다 — 대화형 Codex 의 기본 모델은 Codex 설정(`~/.codex/config.toml`)의 `model` 이고 이 표가 안 든다(게이트웨이
#            자리는 설치기가 회사 설정 틀로 그 값을 쓴다). `-` 거나 줄이 없으면 그 값을 안 심어 래퍼가 그 설정 값으로 뜬다

# ── 사외 — 구독 로그인. Claude 밖의 도구는 구독 한도라 심부름만 진다 ──────────────────────────────────────
# Claude 도 구독이다 — 이 자리의 값은 돈이 아니라 한도라, 깊은 판을 심부름에 쓰면 한도가 먼저 바닥나 모든 레인이 멈춘다.
#   무게를 가르는 것이 곧 한도를 아끼는 길이다
outside  claude  deep      opus
outside  claude  errand    sonnet
# 로그인 한도는 「제미나이」 · 「그외」 갈래마다 차서 로그인 Flash 가 막히면 같은 갈래가 다 막힌다. API 키 한도는 모델마다
#   차서, 키가 있으면 판을 하나씩 내려 돌린 뒤 Claude 갈래를 마지막에 쓴다 — agy 를 쓰는 까닭은 제미나이다
outside  agy     errand    Gemini 3.8 Flash (High)
outside  agy     fallback  api:Gemini 3.8 Flash (High)
outside  agy     fallback  api:Gemini 3.7 Flash (High)
outside  agy     fallback  api:Gemini 3.6 Flash (High)
outside  agy     fallback  Claude Sonnet 4.6 (Thinking)
outside  codex   errand    -

# ── 사내 — 회사 키로 게이트웨이를 탄다. 게이트웨이가 받는 이름만 든다 ────────────────────────────────────
inside   claude  deep      opus
inside   claude  errand    sonnet
# 추론이 드는 일만 Pro 로 보낸다. 회사 키는 예산 한도라 하나가 막히면 다 막혀 넘길 차례를 안 둔다
inside   agy     deep      Gemini 3.1 Pro (High)
inside   agy     errand    Gemini 3.6 Flash (High)
# 깊은 판단과 심부름에 판을 가른다. 더 비싼 판은 비용 때문에 아직 안 쓴다
inside   codex   deep      gpt-5.6-sol
inside   codex   errand    gpt-5.6-luna
