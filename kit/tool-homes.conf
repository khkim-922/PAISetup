# tool-homes.conf — 갈 곳 표. 무엇이 어느 도구 홈에 어떤 꼴로 가나 (결정 0112).
#
# 읽는 자는 손 하나(`.claude/hooks/tool-homes.py`)와, 짐에 싣는 줄을 이 표에서 짓는 뽑는 자(`scripts/build-dist.sh`)다.
# 설치기 · 배포 · 세션 훅은 이 표를 안 읽고 손을 부른다 — 그래서 이 표가 든 사실을 그 셋 안에 다시 적지 않는다.
#
# 손은 PC 의 중립 한 벌 `~/.paisetup` 의 두 층을 채우고, 이 표대로 도구 홈에 놓는다. 어느 도구도 그 자리를 스스로 안 읽는다.
#   standard/ — 설치기가 짐(kit)에서 채운다
#   personal/ — 배포와 세션 훅이 설정 저장소에서 채운다
#   항목마다(each 항목은 그 안의 폴더 하나마다), 개인 층에 있으면 개인 층이 통째로 이긴다
# 이 표는 설정 저장소의 conf 다 — 씨앗 설정 저장소에도 실려, 씨앗으로 만든 저장소도 제 자리에 둔 제 원본으로 개인 층을 채운다.
#
# ⚠ 주석은 `#` 로 여는 줄 전체뿐이다. 칸은 빈칸으로 가르고, 칸 값에는 빈칸이 들 수 없다.

# ── item <항목> <층 안의 자리> <저장소 자리>[,<저장소 자리>…] [local] [each] ──────────────────────────────
# 층 안의 자리는 짐의 꼴이다 — 짐에서는 `kit/<층 안의 자리>` 에 있다. 저장소 자리는 설정 저장소 뿌리 기준이고, 개인 층은 이
# 칸으로만 채운다. 저장소에 그 자리가 없으면 그 항목은 개인 층에서 조용히 빠지고 표준 층이 이긴다. 끝이 `/` 면 폴더고, 두 자리의
# 꼴(파일 · 폴더)은 같다.
# local — 짐에 안 싣는 항목이라 개인 층에만 선다. 뽑는 자는 local 아닌 항목마다 `<저장소 자리> -> kit/<층 안의 자리>` 줄을
#   지어 싣는다 — 그 줄은 `dist.manifest.conf` 에 다시 안 적는다. 저장소 자리가 여럿이면 자리마다 한 줄이다.
# 저장소 자리 여럿 — 쉼표로 가른다(폴더 항목만). 개인 층에서 그 자리들의 내용을 한 폴더로 합친다. 같은 이름이 두 자리에 다
#   있으면 그 이름만 ERROR 를 내고 개인 층에 안 싣는다. 저장소에 없는 자리는 말없이 빠진다.
# each — 항목 폴더 안의 폴더 하나하나가 이기는 단위이자 비키는 단위다(스킬 하나). each 항목의 길은 copy 만 선다.
#   표지 낱말(local · each)은 차례가 없다.
item   norms    norms/norms.md   .claude/CLAUDE.global.md
item   rules    norms/rules/     .claude/rules.global/
item   agents   agents/          agents/                     local
item   memory   memory/global/   memory/global/              local
item   skills   skills/          .claude/skills/,.agents/skills/   each
item   hooks    hooks/           .claude/hooks/

# ── route <항목> <도구> <꼴> <자리> <조건> [<가져올 파일>] ──────────────────────────────────────────────────
# 꼴
#   import  — 그 파일의 표지 사이에 가져오기 줄(`@~/.paisetup/<이긴 층>/<층 안의 자리>`)을 둔다. 표지 밖 글은 사람 것이다.
#             폴더 항목이면 끝 칸 <가져올 파일>이 반드시 서고 줄은 `…/<층 안의 자리><가져올 파일>` 이다 — 항목 폴더 안의 상대
#             자리라 `/` 나 `..` 로 열 수 없고, 이긴 층의 항목 폴더에 그 파일이 없으면 손이 그 줄을 빼고 WARN 을 낸다.
#             끝 칸은 폴더 항목의 import 만 쓴다. 한 자리에 import 길이 여럿 서면 길마다 한 줄을 표의 차례로 둔다
#             (조건이 안 서거나 이긴 층이 없는 길은 줄이 없다) — import 와 다른 꼴은 한 자리에 못 섞인다
#   block   — 그 파일의 표지 사이에 원본 본문을 지어 얹는다. 가져오기 문법이 없는 도구의 꼴이다
#   lines   — 같은 파일의 block 에 룰마다 「이 파일들을 만질 때 이 룰을 먼저 읽는다」 한 줄을 더한다(룰 머리말의 globs · description)
#   include — 파일 통째로 우리 것이다. agy 의 가리킴 한 줄 `@[<항목>](<이 PC 홈의 절대 경로>/…)`
#   list    — 파일 통째로 우리 것이다. agy 의 목록 `{"entries": [{"path": <이 PC 홈의 절대 경로>/…}]}`
#   copy    — 항목의 파일을 그 폴더에 복사한다
#   hook    — Claude 설정 파일의 훅 등록. 폴더 항목을 쓰고, 그 항목은 등록 머리말(아래)을 든 껍데기와 그 껍데기가 제 변수로
#             부르는 곁 파일(`"$<변수>/<이름>"` · 주석 밖)만 싣는다 — 원본 폴더의 다른 파일은 층에 안 간다. 이긴 층의 껍데기마다
#             머리말의 이벤트에 훅 하나씩 놓는다 — 명령 `<변수>="<이긴 층의 항목 폴더 · 절대 · / 로>"; [ -f "$<변수>/<껍데기>" ]
#             || exit 0; . "$<변수>/<껍데기>"` · timeout 10. 가드는 층을 갈아 끼우는 틈에 PreToolUse 를 막지 않게 둔다.
#             우리 것은 그 꼴(가드 · 끝 주석은 없어도 된다)로 두 층의 껍데기를 부르는 훅(가리키는 폴더는 안 가린다)과, 옛
#             판이 껍데기 없이 몸통을 바로 부르던 꼴(`j=$(cat);` 로 열고 껍데기가 부르는 곁 파일을 가리킨다)이다. 훅 하나
#             단위로 고쳐 같은 항목의 남의 훅은 그대로 두고, 우리 것이 둘이면 첫 자리만 남긴다. SessionStart 는 안 건드린다
#             등록 머리말 — 껍데기 맨 위(셔뱅 줄 다음)에 잇달아 선 `# <열쇠> = <값>` 줄들. 그 꼴이 아닌 줄에서 끝난다
#               events = <이벤트>[,<이벤트>…]   이 줄이 있어야 등록이다(SessionStart 는 못 든다)
#               var = <변수>                    껍데기가 제 자리를 읽는 셸 변수
#               matcher = <값>                  이벤트의 matcher 기본
#               matcher.<이벤트> = <값>         그 이벤트만의 matcher
#             UserPromptSubmit 에는 matcher 키를 안 둔다 — 그 이벤트는 matcher 를 안 받고, 키가 있으면 거는 자가 항목째 걸러낸다
#             (#120). 다른 이벤트에 matcher 가 없거나 모르는 열쇠가 들면 머리말이 틀렸다 — 그 길은 설정을 안 건드리고 ERROR 다
#   copy · include · list 로 놓은 파일은 `~/.paisetup/placed.tsv` 에 적는다. import · block 은 표지가, hook 은 명령 꼴이 우리
#   것을 말한다
# 조건
#   box     — 제작자 칸(`PAISETUP_PERSONAL`)에 그 도구가 들었나. 값이 없으면 claude 만이다
#   pick    — 설치기가 고른 제품(`PAISETUP_PICK`)에 그 도구가 들었나. 읽는 차례 · 꼴은 box 와 같고, 값이 없으면 claude 만이다 —
#             설치기가 안 돈 자리(리눅스 원격 · 새 판 설치 전)는 Claude 세션이 이 손을 부르는 자리다. 안 서면 우리 것만 걷는다
route  norms    claude   import    ~/.claude/CLAUDE.md             box
route  memory   claude   import    ~/.claude/CLAUDE.md             box     MEMORY.md
route  rules    claude   copy      ~/.claude/rules/                box
route  agents   claude   copy      ~/.claude/agents/               box
route  norms    codex    block     ~/.codex/AGENTS.md              box
route  rules    codex    lines     ~/.codex/AGENTS.md              box
route  norms    agy      include   ~/.gemini/config/AGENTS.md      box
route  rules    agy      list      ~/.gemini/config/rules.json     box
route  skills   claude   copy      ~/.claude/skills/               box
route  skills   codex    copy      ~/.agents/skills/               box
route  skills   agy      copy      ~/.gemini/config/skills/        box
route  hooks    claude   hook      ~/.claude/settings.json         pick

# ── not <항목> <항목 폴더 안의 이름> <도구 | *> ──────────────────────────────────────────────────────────────
# 그 이름을 그 도구의 홈에 안 놓는다 — `*` 는 어느 홈에도. 층에는 실린다(층은 원본 그대로). 항목에 그 이름이 없으면 말없이
#   지나간다(씨앗으로 만든 저장소에도 이 줄이 그대로 실린다). each 아닌 항목을 가리키거나 도구가 표에 없으면 표가 틀렸다.
# 맡기기 러너는 그 일을 받는 도구의 홈에 안 간다 — 받는 도구가 저를 맡기는 길을 들게 된다(결정 0097).
not    skills   claude-background          claude
not    skills   codex-copilot-background   codex
not    skills   agy-background             agy
# 이 저장소에서만 쓰는 스킬 — 배포본을 뽑는 절차라 다른 저장소를 여는 세션에 따라붙지 않는다.
not    skills   release-dist               *

# ── keep <자리> ─────────────────────────────────────────────────────────────────────────────────────────
# 다른 주인의 자리 — 손은 그 아래를 쓰지도 · 걷지도 · 비키지도 · 기록하지도 않는다. 놓을 이름이 그 자리에 떨어지면 WARN 하고
#   건너뛴다.
# Claude 데스크탑 앱이 claude.ai 에서 받아 두는 스킬 자리다.
keep   ~/.claude/skills/synced/

# ── was <대상 폴더> <옛 기록> [shared] ──────────────────────────────────────────────────────────────────────
# 손 전에 설치기 · 배포가 그 대상 폴더에 놓은 스킬 이름을 한 줄에 하나씩 적던 기록. 손은 처음 놓을 때 이 이름들을 가르고,
#   다 가른 기록 파일을 백업 자리로 옮긴다 — 가르는 법과 기록을 남겨 두는 판은 손의 머리말이 든다.
# shared — 설치기의 「칸 없이 까는 걸음」이 이 기록을 아직 쓴다. 그 도구가 칸에 안 들면 손이 이 기록을 안 건드린다.
was    ~/.claude/skills/          ~/.claude/.paisetup-skills          shared
was    ~/.agents/skills/          ~/.agents/.paisetup-skills          shared
was    ~/.agents/skills/          ~/.agents/.paisetup-deploy-skills
was    ~/.gemini/config/skills/   ~/.gemini/.paisetup-skills          shared
was    ~/.gemini/config/skills/   ~/.gemini/.paisetup-deploy-skills

# ── old <자리> [<옛 기록>[,<옛 기록>…] | list] ─────────────────────────────────────────────────────────────
# 손이 걷는 옛 자리 — 새 층이 선 뒤 백업 자리로 옮긴다. 셋째 칸이 없으면 통째로 옮긴다.
# 옛 기록 — 그 기록들에 든 이름의 폴더만 옮기고, 다 옮긴 뒤 비면 폴더도 옮긴다. 기록에 없는 것은 말없이 둔다.
# list — agy 목록 파일이 우리가 써 온 꼴(표의 다른 old 폴더를 가리키는 항목 하나)일 때만 옮긴다. 사람 항목이 섞였으면 WARN.
old    ~/.paisetup/norms/
old    ~/.gemini/config/paisetup-skills/   ~/.gemini/.paisetup-skills,~/.gemini/.paisetup-deploy-skills
old    ~/.gemini/config/skills.json        list
old    ~/.codex/skills/                    ~/.codex/.paisetup-skills

# ── stamp <원본 커밋 시각> ────────────────────────────────────────────────────────────────────────────────
# 판 도장 — 짐과 씨앗에 실리는 이 표의 사본에만 선다. 뽑는 자가 원본 커밋 시각(UTC)을 사본 끝에 한 줄 찍고, 이 원본에는 없다.
# 이 줄은 「배포본의 사본」이라는 표시다 — 손은 값을 안 읽고, 개인 층 표에 이 줄이 있나로 놓는 손을 가른다(손의 머리말).
stamp 2026-10-12T10:09:20Z
