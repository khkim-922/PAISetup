# deploy.skills.targets.conf — **맡기기 러너가 맡기는 상대.** 러너는 그 상대의 스킬 홈에 안 간다.
#
# 도구마다 제 스킬 홈을 든다 — Claude `~/.claude/skills` · Codex `~/.agents/skills` · agy `~/.gemini/config/paisetup-skills`
# (결정 0099). 러너는 **맡기는 쪽** 홈에 산다(0097) — 받는 쪽 홈에 서면 그 도구가 제게 맡기는 길을 든다. 그래서 러너마다
# 받는 쪽 하나를 여기 적고, `deploy.ps1` 은 그 홈에만 안 민다. 나머지 홈에는 다 간다.
#
# ⚠ **배포본 설치기도 이 표를 읽는다** — 배포본에 `kit/skills.targets.conf` 로 그대로 실리고(결정 0101), 설치기가 홈에
#   깔 이름을 고르는 자리마다 이 표로 거른다. 같은 사실을 설치기 안에 따로 적지 않는다.
#   줄의 꼴(러너 · 받는 쪽 · 스킬이 있나)은 `scripts/check-codex-norms.py` 가 잰다.
#
# 한 줄에 `<스킬 이름> <받는 쪽>` — 받는 쪽은 claude · codex · agy 가운데 하나다.

agy-background            agy
codex-copilot-background  codex
claude-background         claude
