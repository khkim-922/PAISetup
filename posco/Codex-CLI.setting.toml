model = "gpt-5.6-sol"
model_provider = "pgpt"
model_reasoning_effort = "low"
web_search = "live"

# 훅 몸통은 배포 씨앗에서 온다. Codex 는 다음 대화형 시작에서 새 훅을 신뢰할지 묻는다.
[hooks]
UserPromptSubmit = [
  { hooks = [
    { type = "command", command = "python -X utf8 ~/.claude/seeds/config-repo/.claude/hooks/drm-guide.py", commandWindows = "python -X utf8 \"$env:USERPROFILE/.claude/seeds/config-repo/.claude/hooks/drm-guide.py\"", async = false, timeout = 10, statusMessage = "DRM 파일 확인 중" },
  ] },
]
PreToolUse = [
  { matcher = "view_image|functions.view_image", hooks = [
    { type = "command", command = "python -X utf8 ~/.claude/seeds/config-repo/.claude/hooks/codex-image-gate.py", commandWindows = "python -X utf8 \"$env:USERPROFILE/.claude/seeds/config-repo/.claude/hooks/codex-image-gate.py\"", async = false, timeout = 10, statusMessage = "이미지 크기 확인 중" },
  ] },
  { matcher = "Bash|shell|exec_command|functions.exec", hooks = [
    { type = "command", command = "python -X utf8 ~/.claude/seeds/config-repo/.claude/hooks/codex-safety-hooks.py bash-backslash", commandWindows = "python -X utf8 \"$env:USERPROFILE/.claude/seeds/config-repo/.claude/hooks/codex-safety-hooks.py\" bash-backslash", async = false, timeout = 10, statusMessage = "Bash 역슬래시 확인 중" },
  ] },
]
PostToolUse = [
  { matcher = "apply_patch|functions.apply_patch", hooks = [
    { type = "command", command = "python -X utf8 ~/.claude/seeds/config-repo/.claude/hooks/codex-safety-hooks.py utf8-bom", commandWindows = "python -X utf8 \"$env:USERPROFILE/.claude/seeds/config-repo/.claude/hooks/codex-safety-hooks.py\" utf8-bom", async = false, timeout = 10, statusMessage = "PowerShell UTF-8 BOM 확인 중" },
  ] },
]

[model_providers.pgpt]
name = "P-GPT Internal Server"
base_url = "http://127.0.0.1:18901/gpgpta01-gpt/v1"
env_key = "OPENAI_API_KEY"
supports_standalone_web_search = true

[windows]
sandbox = "elevated"
